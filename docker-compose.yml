services:
  nuxt:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: pnpm run dev

  nuxt-prod:
    build:
      context: .
      target: build
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    command: node .output/server/index.mjs
    restart: unless-stopped
